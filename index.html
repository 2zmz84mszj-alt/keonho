<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Story Viewer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #1c1c1e; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; color: #fff; }
        
        .phone-frame {
            width: 390px; height: 844px; background-color: #000; border-radius: 50px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); position: relative; overflow: hidden;
            border: 12px solid #333; display: flex; flex-direction: column;
        }

        .dynamic-island {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            width: 120px; height: 32px; background-color: #000; border-radius: 20px; z-index: 1000;
            display: flex; align-items: center; justify-content: space-between; padding: 0 10px;
        }
        .island-cam { width: 12px; height: 12px; background-color: #111; border-radius: 50%; }

        .screen { width: 100%; height: 100%; position: relative; overflow: hidden; display: flex; flex-direction: column; }

        /* Lock Screen */
        #lock-screen {
            position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop') center/cover;
            z-index: 100; display: flex; flex-direction: column; align-items: center; padding-top: 80px; transition: transform 0.5s ease;
        }
        .lock-time { font-size: 75px; font-weight: 300; letter-spacing: -2px; }
        .lock-date { font-size: 18px; font-weight: 500; margin-top: -5px; }
        .notification {
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(20px);
            width: 85%; padding: 15px; border-radius: 20px; margin-top: 40px; cursor: pointer;
        }
        .notif-title { font-size: 13px; opacity: 0.8; margin-bottom: 3px; }
        .notif-body { font-size: 15px; font-weight: 600; }
        .swipe-hint { position: absolute; bottom: 30px; font-size: 14px; opacity: 0.7; animation: bounce 1.5s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        /* Home Screen */
        #home-screen {
            flex: 1; padding: 70px 20px 20px 20px; display: flex; flex-direction: column;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop') center/cover;
        }
        .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .app-icon { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .app-box { width: 60px; height: 60px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .app-name { font-size: 12px; margin-top: 6px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

        /* App View */
        .app-view { position: absolute; inset: 0; background: #000; z-index: 50; display: none; flex-direction: column; }
        .app-header { padding: 55px 20px 15px 20px; font-size: 24px; font-weight: bold; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; }
        .back-btn { font-size: 15px; color: #0a84ff; cursor: pointer; background: none; border: none; }
        .app-content { flex: 1; overflow-y: auto; padding: 20px; }

        /* iMessage Style */
        .chat-bubble { max-width: 75%; padding: 10px 14px; border-radius: 18px; margin-bottom: 10px; font-size: 14px; line-height: 1.4; }
        .chat-left { background: #262628; align-self: flex-start; }
        .chat-right { background: #0a84ff; align-self: flex-end; color: #fff; }
        .chat-container { display: flex; flex-direction: column; }

        /* Bottom Home Bar */
        .home-bar { width: 130px; height: 5px; background: #fff; border-radius: 10px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); cursor: pointer; z-index: 1000; opacity: 0.8; }
    </style>
</head>
<body>

<div class="phone-frame">
    <div class="dynamic-island">
        <div class="island-cam"></div>
        <div style="width: 10px; height: 10px; background: #050505; border-radius: 50%;"></div>
    </div>

    <!-- 잠금화면 -->
    <div id="lock-screen" onclick="unlockPhone()">
        <div class="lock-time" id="current-time">18:28</div>
        <div class="lock-date">10월 20일 화요일</div>
        <div class="notification" onclick="openApp('message')">
            <div class="notif-title">메시지 • 방금 전</div>
    <div class="notif-body">오늘 이따가 볼 수 있어?</div>
        </div>
        <div class="swipe-hint">위로 쓸어올려 잠금 해제</div>
    </div>

    <!-- 홈화면 -->
    <div id="home-screen">
